name: Web

# Publica a versão para telemóvel (PWA) no Cloudflare Pages, com as mesmas tags do
# programa de computador: as duas versões andam sempre a par, e nada vai para o ar
# sem se criar uma versão. "Run workflow" no separador Actions publica à mão.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirmar que os segredos existem
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          FALTAM=""
          for NOME in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!NOME}" ]; then FALTAM="$FALTAM $NOME"; fi
          done
          if [ -n "$FALTAM" ]; then
            echo "::error::Faltam segredos no GitHub:$FALTAM (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compilar
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # Da primeira vez o projeto ainda não existe no Cloudflare; depois este passo
      # só diz que já existe, e segue.
      - name: Criar o projeto no Cloudflare (só da primeira vez)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create flor-de-lotus --production-branch=main

      - name: Publicar
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=flor-de-lotus --branch=main --commit-dirty=true
